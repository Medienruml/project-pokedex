<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="shortcut icon" href="./assets/icons/Poké_Ball_icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standards.css">
    <link rel="stylesheet" href="./styles/pokegrid.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="style.css">

    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
</head>

<body onload="init()">
    <header class="wrapper">
        <img src="./assets/icons/Poké_Ball_icon.svg" alt="Icon Pok´ball">
        <h1>Pokédex</h1>

    </header>
    <section class="hero-section wrapper">
        <div class="hero-container">
            <h2>Discover the world of Pokémon</h2>
            <p>Search, find out more and expand your knowledge <br>of your favourite Pokémon</p>
        </div>


    </section>
    <section class="search-section wrapper">
        <div class="search-container">
            <input type="text" name="search-bar" id="" data-id="search-input"
                placeholder="Find your Pokémon (Pikachu, 25 or type electro ...)">
            <button></button>
        </div>
    </section>
    <section class="controls-container wrapper">

        <div class="type-filter" id="typeFilter">

            <button class="active">Alle</button>
            <button class="type-normal">normal</button>
            <button class="type-fire">fire</button>
            <button class="type-water">water</button>
            <button class="type-grass">grass</button>
            <button class="type-electric">electric</button>
            <button class="type-ice">ice</button>
            <button class="type-fighting">fighting</button>
            <button class="type-poison">poison</button>
            <button class="type-ground">ground</button>
            <button class="type-flying">flying</button>
            <button class="type-psychic">psychic</button>
            <button class="type-bug">bug</button>
            <button class="type-rock">rock</button>
            <button class="type-ghost">ghost</button>
            <button class="type-dragon">dragon</button>
            <button class="type-dark">dark</button>
            <button class="type-steel">steel</button>
            <button class="type-fairy">fairy</button>

        </div>

        <div class="list-options">

            <p id="pokemonCounter">
                <span>30</span> von <span>1.025</span> Pokémon angezeigt
            </p>

            <select id="sortPokemon">
                <option value="number">
                    Nummer (aufsteigend)
                </option>
                <option value="number">
                    Nummer (absteigend)
                </option>
                <option value="name">
                    Name (A-Z)
                </option>
            </select>

        </div>

    </section>
    <main class="wrapper" data-id="content">
        <div class="pokemon-grid" id="pokemonGrid">
        </div>
        <button onclick="loadPokemon()" data-id="load-more-button" class="load-more-btn" id="loadMoreButton">
            + 30 weitere Pokémon laden
        </button>
    </main>
    <footer class="footer wrapper">

        <div class="logo">
            <img src="./assets/icons/Poké_Ball_icon.svg" alt="">
            <span>Pokédex</span>
        </div>
        <p>© Michael Ruml 2026</p>

        <nav>
            <a href="https://pokeapi.co/" target="_blank">API</a>
            <a href="#">Impressum</a>
        </nav>

    </footer>

    <dialog class="" id="pokemonDialog"></dialog>

</body>

</html>
