<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="icon" href="./assets/icons/pokeball_icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standards.css">
    <link rel="stylesheet" href="./styles/pokegrid.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="style.css">

    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>
</head>

<body onload="init()">
    <header class="wrapper">
        <img src="./assets/icons/pokeball_icon.svg" alt="Icon Pokéball">
        <h1>Pokédex</h1>

    </header>
    <section class="hero-section wrapper">
        <div class="hero-container">
            <h2>Entdecke die Welt der Pokémon</h2>
            <p>Suche, informiere dich und erweitere dein Wissen über deine Lieblings-Pokémon</p>
        </div>


    </section>
    <section class="search-section wrapper">
        <div class="search-container">
            <input onkeydown="if (event.key === 'Enter') searchPokemonList()" type="text" name="search-bar" id="searchPokemon" data-id="search-button"
                placeholder="Finde dein Pokémon">
            <button onclick="searchPokemonList()"></button>
        </div>
    </section>
    <section class="controls-container wrapper">

        <!-- <div class="type-filter" id="typeFilter">

            <button class="active">Alle</button>
            <button class="type-normal">normal</button>
            <button class="type-fire">fire</button>
            <button class="type-water">water</button>
            <button class="type-grass">grass</button>
            <button class="type-electric">electric</button>
            <button class="type-ice">ice</button>
            <button class="type-fighting">fighting</button>
            <button class="type-poison">poison</button>
            <button class="type-ground">ground</button>
            <button class="type-flying">flying</button>
            <button class="type-psychic">psychic</button>
            <button class="type-bug">bug</button>
            <button class="type-rock">rock</button>
            <button class="type-ghost">ghost</button>
            <button class="type-dragon">dragon</button>
            <button class="type-dark">dark</button>
            <button class="type-steel">steel</button>
            <button class="type-fairy">fairy</button>

        </div> -->

        <div class="list-options">

            <p id="pokemonCounter">
                <span>30</span> von <span>1.025</span> Pokémon angezeigt
            </p>

            <select id="sortPokemon" onchange="sortPokemon(this.value)">
                <option value="number-asc">
                    Nummer (aufsteigend)
                </option>
                <option value="number-desc">
                    Nummer (absteigend)
                </option>
                <option value="name-asc">
                    Name (A-Z)
                </option>
                <option value="name-desc">
                    Name (Z-A)
                </option>
            </select>

        </div>

    </section>
    <main class="wrapper" data-id="content">
        <ul class="pokemon-grid" id="pokemonGrid">
        </ul>
        <button onclick="loadPokemon()" data-id="load-more-button" class="load-more-btn" id="loadMorePokemonButton">
            + <span>30</span> weitere Pokémon laden
        </button>
    </main>
    <footer class="footer wrapper">

        <div class="logo">
            <img src="./assets/icons/pokeball_icon.svg" alt="Pokéball Icon">
            <span>Pokédex</span>
        </div>
        <p>© Michael Ruml 2026</p>

        <nav>
            <a href="https://pokeapi.co/" target="_blank">Pokémon-API</a>
        </nav>

    </footer>

    <dialog onkeydown="keyNavigation(event)" id="pokemonDialog" onclick="closeDialog(event)" data-id="dialog"></dialog>

</body>

</html>
